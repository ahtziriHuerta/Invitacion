<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación Ahtziri & Juan</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<audio id="musica" src="musica.mp3"></audio>
<body>

    <div class="invitation-wrapper" id="mainContainer" onclick="openAndRedirect()">
        <div class="flap top">
            <div class="top-text">Ahtziri<br>&<br>Juan</div>
        </div>
        
        <div class="flap left"></div>
        <div class="flap right"></div>
        <div class="flap bottom"></div>

        <div class="bottom-text">
            Tenemos una noticia...<br>
            <strong>¡HAZ CLIC PARA ABRIR!</strong>
        </div>
        
        <div class="seal">
            <div class="seal-inner">🌿</div>
        </div>
    </div>

    <script>
        function openAndRedirect() {
        
            const container = document.getElementById('mainContainer');
        
            // Obtener parámetro familia
            const params = new URLSearchParams(window.location.search);
            const familiaID = params.get("familia");
        
            // Animación
            container.classList.add('is-open');
        
            setTimeout(() => {
                container.style.transition = "opacity 0.1s ease";
                container.style.opacity = "0";
            }, 2200);
        
            // Redirección CON parámetro
            setTimeout(() => {
                if (familiaID) {
                    window.location.href = "index1.html?familia=" + familiaID;
                } else {
                    window.location.href = "index1.html";
                }
            }, 650);
        }
        </script>
</body>
</html>
